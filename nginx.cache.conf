# Nginx cache configuration for production
# Add this to your server block in nginx.conf

# Disable caching for HTML files
location ~* \.html?$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
}

# Cache JavaScript and CSS with long expiration (1 year)
# These files have content hash, safe to cache long-term
location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Cache images (1 month)
location ~* \.(jpg|jpeg|png|gif|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# Cache fonts (1 year)
location ~* \.(eot|otf|ttf|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Do not cache JSON files
location ~* \.json$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

# Security headers
add_header X-Content-Type-Options "nosniff";
add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "no-referrer-when-downgrade";

# SPA routing - send all requests to index.html
location / {
    try_files $uri $uri/ /index.html;
}
